<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darija Conjugation Game</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>Polyglot Master</h1>
        </div>
        
        <div class="language-slider">
            <input type="radio" id="lang-darija" name="language" value="darija" checked>
            <label for="lang-darija">Darija</label>

            <input type="radio" id="lang-urdu" name="language" value="urdu">
            <label for="lang-urdu">Urdu</label>

            <input type="radio" id="lang-nepali" name="language" value="nepali">
            <label for="lang-nepali">Nepali</label>
        </div>
        <div class="language-slider" style="margin-top: 10px; background: #cfd8dc;">
            <input type="radio" id="diff-auto" name="difficulty" value="auto" checked>
            <label for="diff-auto">Auto (SRS)</label>

            <input type="radio" id="diff-easy" name="difficulty" value="easy">
            <label for="diff-easy">Easy</label>

            <input type="radio" id="diff-hard" name="difficulty" value="hard">
            <label for="diff-hard">Hard</label>
        </div>

        <div class="scenario-box">
            <p>How do you say:</p>
            <h2 id="prompt-text">Loading...</h2>
        </div>

        <div class="options-grid" id="options-container">
            </div>

        <div id="feedback-box" class="feedback hidden">
            <h3 id="feedback-title"></h3>
            <button id="next-btn">Next Question</button>
        </div>
    </div>

    <script src="/static/game.js"></script>
</body>
</html>
