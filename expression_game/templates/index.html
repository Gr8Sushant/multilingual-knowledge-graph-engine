<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expression Master</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>Cultural Pragmatics</h1>
        </div>
        
        <div class="language-slider">
            <input type="radio" id="lang-darija" name="language" value="darija" checked>
            <label for="lang-darija">Darija</label>

            <input type="radio" id="lang-urdu" name="language" value="urdu">
            <label for="lang-urdu">Urdu</label>

            <input type="radio" id="lang-nepali" name="language" value="nepali">
            <label for="lang-nepali">Nepali</label>
            <input type="radio" id="lang-vietnamese" name="language" value="vietnamese">
            <label for="lang-vietnamese">Vietnamese</label>
        </div>
        
        <div class="language-slider diff-slider">
            <input type="radio" id="diff-easy" name="difficulty" value="easy" checked>
            <label for="diff-easy">Easy (Semantic)</label>

            <input type="radio" id="diff-hard" name="difficulty" value="hard">
            <label for="diff-hard">Hard (Nuance)</label>
        </div>

        <div class="scenario-box">
            <p>What do you say here?</p>
            <h2 id="prompt-text">Loading...</h2>
        </div>

        <div class="options-grid" id="options-container"></div>

        <div id="feedback-box" class="feedback hidden">
            <h3 id="feedback-title"></h3>
            <p id="feedback-explanation" style="font-size: 0.9em; color: #555;"></p>
            <button id="next-btn">Next Situation</button>
        </div>
    </div>

    <script src="/static/game.js"></script>
</body>
</html>
